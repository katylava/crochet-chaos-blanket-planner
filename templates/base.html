<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chaos Blanket Planner{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.classless.min.css">
  <style>
    /* Small buttons for the inline forms in table rows and the nav. */
    td form, nav form { display: inline; margin: 0; }
    td button, nav button { padding: 0.2rem 0.6rem; margin: 0 0.25rem 0 0; font-size: 0.875rem; width: auto; }
    /* Wide tables scroll sideways on phones instead of widening the page. */
    .table-scroll { overflow-x: auto; }
    .messages li { color: var(--pico-del-color); list-style: none; }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul><li><strong><a href="{% url 'project_list' %}">Chaos Blanket Planner</a></strong></li></ul>
      {% if user.is_authenticated %}
      <ul>
        <li><a href="{% url 'project_list' %}">Projects</a></li>
        <li><a href="{% url 'stitch_list' %}">Stitches</a></li>
        <li><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form></li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
