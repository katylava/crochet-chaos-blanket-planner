{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block content %}
<h1>Projects</h1>
<p><a href="{% url 'project_create' %}">New project</a></p>
<ul>
  {% for project in projects %}
  <li><a href="{% url 'project_detail' project.pk %}">{{ project.name }}</a></li>
  {% empty %}
  <li>No projects yet.</li>
  {% endfor %}
</ul>
{% endblock %}
