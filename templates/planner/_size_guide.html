<section>
  <h2>Size guide</h2>
  <p>{{ guide_text }}</p>
  <div class="table-scroll"><table>
    <tr><th>Size</th><th>Width (inches)</th><th>Stitch count</th><th></th></tr>
    {% for size in sizes %}
    <tr>
      <td>{{ size.name }}</td>
      <td>{{ size.width }}</td>
      <td>{{ size.low }} to {{ size.high }}</td>
      <td>{{ size.note }}</td>
    </tr>
    {% endfor %}
  </table></div>
</section>
